name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        # Pinned to v4 (latest stable manifest-driven major).
        # NOTE: GITHUB_TOKEN cannot trigger downstream workflows on the
        # release PR. To enable CI on the PR, register a PAT or App token
        # as RELEASE_PLEASE_TOKEN secret and replace the token line below.
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
