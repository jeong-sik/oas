name: Hardening Ratchet

# Advisory monotone-decrease ratchet for the metrics defined in
# docs/rfc/RFC-OAS-023-hardening-ratchet.md §3.
#
# This workflow is intentionally advisory while the detector relies on
# line-oriented analysis. It reports metric deltas as a PR check but does
# not block merging, so brittle matches cannot freeze the repo. Once the
# detector graduates to AST/parsetree-based analysis the workflow can be
# made required.
#
# Baseline:    .ci/hardening-baseline.json
# Gate script: scripts/hardening-ratchet.sh
# RFC:         docs/rfc/RFC-OAS-023-hardening-ratchet.md

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run production hardening ratchet
        id: ratchet
        run: |
          set +e
          bash scripts/hardening-ratchet.sh --check
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Report ratchet result (advisory)
        run: |
          rc="${{ steps.ratchet.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::warning::Hardening ratchet reports metric increases. See logs for details. This is currently advisory."
          else
            echo "Hardening ratchet held or improved."
          fi
          exit 0
